[project]
name = "algos-python"
version = "0.1.0"
description = "Python LeetCode/CodeForces solutions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[project.scripts]
probe7 = "probe7.main:main"

[tool.ruff]
target-version = "py314"

[tool.uv.workspace]
members = [
    "Algorithms/token_bucket",
    "Algorithms/id_allocator",
    "Algorithms/web_crawler",
    "Futures/multithreading",
    "Algorithms/file_duplicates",
    "Algorithms/hit_counter",
    "Algorithms/permissions_fs",
    "Algorithms/rwlock_semaphores",
    "Algorithms/double_circuit_breaker",
    "Algorithms/event_logger",
    "Algorithms/api_design",
    "Algorithms/kv_store",
    "Algorithms/hangman",
    "Algorithms/evil_hangman",
    "Algorithms/fs_crawler",
    "Algorithms/byte_pattern",
    "Algorithms/producer_consumer_service",
    "Algorithms/lru",
    "Algorithms/build_fs",
    "Algorithms/snapshot_set",
    "Algorithms/word_guessing_feedback",
    "preparation/probe1",
    "preparation/probe2",
    "preparation/probe3",
    "preparation/probe4",
    "preparation/probe5",
    "preparation/probe6",
    "Algorithms/probe2/kvstore",
    "preparation/probe7",
    "preparation/probe8",
    "preparation/probe9",
    "preparation/probe10",
    "preparation/probe11",
]
